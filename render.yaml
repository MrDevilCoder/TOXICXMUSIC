# render.yaml - Deployment configuration for Render

services:
  # Main Bot Service
  - type: web
    name: telegram-music-bot
    env: python
    region: oregon
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python bot/main.py
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: PORT
        value: "8080"
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    domains:
      - musicbot.yourdomain.com

  # Worker Service (Background Tasks)
  - type: worker
    name: music-bot-worker
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/worker.py
    plan: starter
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false

  # Database Service
  - type: pserv
    name: music-bot-db
    env: docker
    plan: starter
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 5

# Background Workers
  - type: cron
    name: keep-alive-cron
    env: python
    region: oregon
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python utils/cron_keep_alive.py
    envVars:
      - key: APP_URL
        sync: false

# Static Site (Dashboard)
  - type: static
    name: music-bot-dashboard
    env: static
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: ./dashboard/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Docker Configuration
  - type: web
    name: music-bot-docker
    env: docker
    region: oregon
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false

# Database Backup
  - type: cron
    name: db-backup
    env: python
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python utils/backup.py
