version: '3.8'

services:
  bot:
    build: .
    container_name: music-bot
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=sqlite:///data/bot.db
      - APP_URL=${APP_URL}
    depends_on:
      - redis
    networks:
      - bot-network

  redis:
    image: redis:7-alpine
    container_name: music-bot-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - bot-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - bot-network

volumes:
  redis-data:

networks:
  bot-network:
    driver: bridge
